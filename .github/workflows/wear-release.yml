name: Wear release

# Pushing a wear-v* tag (e.g. wear-v0.1.0) builds the APK signed with the fixed key and publishes a GitHub release.
on:
  push:
    tags: ['wear-v*']

permissions:
  contents: write

concurrency:
  group: wear-release-${{ github.ref }}

jobs:
  release:
    name: Signed APK and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' wear/app/build.gradle.kts)
          if [ "wear-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName ($version) in wear/app/build.gradle.kts"
            exit 1
          fi

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: wear
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs wear/app/build/outputs/apk/release/app-release.apk
          cp wear/app/build/outputs/apk/release/app-release.apk "badger-remote-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v3
        with:
          name: Badger Remote ${{ github.ref_name }}
          generate_release_notes: true
          files: badger-remote-${{ github.ref_name }}.apk
