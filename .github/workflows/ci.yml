name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge:
    name: Badge (MicroPython)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Full history: the contacts test reads the stock app from the first commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # CPython only checks the syntax: the badge's modules (badgeware, bluetooth…) are not available here
      - name: Check the syntax of system/
        run: |
          python - <<'PY'
          import pathlib, sys
          failed = 0
          for path in sorted(pathlib.Path("system").rglob("*.py")):
              try:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
              except SyntaxError as error:
                  print(f"::error file={path},line={error.lineno}::{error.msg}")
                  failed += 1
          sys.exit(1 if failed else 0)
          PY

      - name: Contacts compatibility test
        run: python tests/test_contacts_compat.py

      - name: Radar behavior tests
        run: python tests/test_radar.py

      - name: Watch steps tests
        run: python tests/test_watch_steps.py

      - name: Duck Maze level checks
        run: python tests/test_duck_maze.py

      - name: App checks (README, icon, paths)
        run: python tests/test_apps.py

      - name: Store catalog checks
        run: python tests/test_catalog.py

      - name: Guides checks
        run: python tests/test_guides.py

      - name: Badge Studio syntax
        run: node --check docs/studio/studio.js && node --check docs/site.js && node --check docs/guides/guides.js

  wear:
    name: Wear OS app (build, tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wear

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android lint
        run: ./gradlew lintDebug

      # Unsigned here: only checks that R8 (minification) passes before pushing a tag
      - name: Build the release
        run: ./gradlew assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: badger-remote-debug
          path: wear/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: wear/app/build/reports/lint-results-debug.html
          retention-days: 14
